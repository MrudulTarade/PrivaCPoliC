<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Privacy Policy</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#021B33,#04395E,#0A4D68);
            color:white;

        }

        .container{

            width:90%;
            max-width:700px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:20px;
            padding:50px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,0.35);

        }

        h1{

            font-size:2.7rem;
            margin-bottom:15px;

        }

        .highlight{

            color:#6DE1FF;

        }

        p{

            color:#d8e7f4;
            margin-bottom:35px;
            line-height:1.7;

        }

        .upload-box{

            border:2px dashed #6DE1FF;
            border-radius:18px;
            padding:45px 25px;
            margin-bottom:25px;
            transition:.3s;

        }

        .upload-box:hover{

            background:rgba(255,255,255,0.05);

        }

        input[type=file]{

            display:none;

        }

        .choose-btn{

            display:inline-block;
            padding:14px 30px;
            border-radius:40px;
            background:#3DDCFF;
            color:#03263F;
            cursor:pointer;
            font-weight:600;
            transition:.3s;

        }

        .choose-btn:hover{

            background:#7CEBFF;

        }

        #fileName{

            margin-top:18px;
            color:#bfefff;
            font-size:.95rem;

        }

        button{

            margin-top:35px;
            border:none;
            background:#00C897;
            color:white;
            padding:16px 42px;
            border-radius:40px;
            font-size:1rem;
            font-weight:600;
            cursor:pointer;
            transition:.3s;

        }

        button:hover{

            transform:translateY(-3px);
            background:#13dca8;

        }

        .back{

            margin-top:30px;

        }

        .back a{

            color:#9EE9FF;
            text-decoration:none;

        }

        .back a:hover{

            text-decoration:underline;

        }

    </style>

</head>
<body>

<div class="container">

    <h1>Upload <span class="highlight">Privacy Policy</span></h1>

    <p>
        Select a Privacy Policy PDF to begin the AI-powered summarization process.
        The uploaded document will be analyzed to generate a concise summary of
        important privacy practices and user rights.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="upload-box">

            <label for="pdfFile" class="choose-btn">
                📄 Choose PDF
            </label>

            <input
                type="file"
                id="pdfFile"
                name="pdf_file"
                accept=".pdf"
                required
            >

            <p id="fileName">
                No file selected
            </p>

        </div>

        <button type="submit">
            🚀 Upload & Summarize
        </button>

    </form>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

const fileInput = document.getElementById("pdfFile");
const fileName = document.getElementById("fileName");

fileInput.addEventListener("change", function(){

    if(this.files.length > 0){

        fileName.textContent = "Selected: " + this.files[0].name;

    }
    else{

        fileName.textContent = "No file selected";

    }

});

</script>

</body>
</html>
