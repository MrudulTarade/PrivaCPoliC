
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ask a Question</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #021B33, #04395E, #0A4D68);
            min-height: 100vh;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }

        .container {
            width: 90%;
            max-width: 950px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;

            padding: 50px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .highlight {
            color: #6DE1FF;
        }

        .subtitle {
            text-align: center;
            color: #d9edf8;
            margin-bottom: 40px;
        }

        /* Question form */

        .question-form {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .question-input {
            flex: 1;

            padding: 16px 20px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.08);

            color: white;
            font-size: 1rem;

            outline: none;
        }

        .question-input::placeholder {
            color: #b9d4df;
        }

        .question-input:focus {
            border-color: #3DDCFF;
        }

        .ask-btn {
            padding: 15px 30px;

            border: none;
            border-radius: 12px;

            background: #3DDCFF;
            color: #03263F;

            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .ask-btn:hover {
            background: #73EAFF;
        }

        /* Chat */

        .chat-box {
            background: rgba(255, 255, 255, 0.05);

            border-left: 5px solid #3DDCFF;

            border-radius: 12px;

            padding: 30px;

            line-height: 1.8;

            color: #eef8fd;

            font-size: 1.05rem;
        }

        .question {
            font-weight: 700;
            color: #6DE1FF;

            margin-bottom: 15px;
        }

        .answer {
            color: #eef8fd;
            white-space: pre-line;
        }

        .buttons {
            margin-top: 40px;

            display: flex;
            justify-content: center;

            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;

            padding: 15px 35px;

            border-radius: 40px;

            font-weight: 600;

            transition: 0.3s;
        }

        .secondary {
            background: #00C897;
            color: white;
        }

        .secondary:hover {
            background: #17D8A5;
        }

        @media(max-width: 768px) {

            .container {
                padding: 30px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .question-form {
                flex-direction: column;
            }

            .ask-btn {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>
        Ask <span class="highlight">Questions</span>
    </h1>

    <p class="subtitle">
        Ask questions about the uploaded Privacy Policy.
    </p>


    <!-- Question Form -->

    <form method="POST" class="question-form">

        <input
            type="text"
            name="question"
            class="question-input"
            placeholder="Ask something about the Privacy Policy..."
            required
            autocomplete="off"
        >

        <button type="submit" class="ask-btn">
            Ask
        </button>

    </form>


    <!-- Current Question and Answer -->

    {% if question %}

    <div class="chat-box">

        <div class="question">
            {{ question }}
        </div>

        <div class="answer">
            {{ answer }}
        </div>

    </div>

    {% endif %}


    <div class="buttons">

        <a href="/" class="btn secondary">
            📄 Upload Another PDF
        </a>

    </div>

</div>

</body>
</html>
